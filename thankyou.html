    <style>
        h2 {
            font-family: Poppins;
            font-weight: 300;
            color: #fff;
            font-size: 19px;
        }
        
        h2 span {
            display: block;
            font-size: 40px;
            color: #fff;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        body {
            background: #e6b820;
        }
        
        .thankyou {
            margin: auto;
            max-width: 600px;
            position: fixed;
            transform: translate(-50%, -50%);
            left: 50%;
            top: 50%;
            text-align: center;
            background: #37296b;
            padding: 46px;
            border-radius: 7px;
        }
        
        .thankyou img {
            width: 180px;
            margin: 0 0 30px;
        }
        .btn-primary {
            background-color: #f2dbf4;
            color: #000;
            border: 1px solid #6e3173;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 23px;
            text-decoration: none;
        }
        
        .btn-primary:hover {
            background-color: #ed3237;
            border-color: #ed3237;
        }
        
        .btn-primary:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(110, 49, 115, 0.3);
        }

        @media screen and (min-width:0) and (max-width:780px) {
            .thankyou {
                margin: auto;
                max-width: 100%;
                position: static;
                transform: translate(0%, 0%);
                left: 50%;
                top: 50%;
                text-align: center;
                background: #37296b;
                padding: 30px;
                border-radius: 7px;
                width: auto;
            }
            h2 {
                font-family: Poppins;
                font-weight: 300;
                color: #fff;
                font-size: 14px;
            }
            .thankyou img{
                width: 200px;
            }
            .btn-primary{
                font-size: 12px;
            }
        }
    </style>
    <div class="thankyou">
        <img src="assets/img/logo.png" class="img-fluid">
